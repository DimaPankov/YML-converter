name: Desktop builds
on:
  push:
    paths-ignore: ['legacy/**']
  pull_request:
    paths-ignore: ['legacy/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Gradle's org.gradle.jvmargs does not configure the child jpackage JVM.
          # Keep jpackage argument-file decoding consistent with Gradle.
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
        run: |
          .\gradlew.bat :composeApp:desktopTest :composeApp:createDistributable :composeApp:packageDistributionForCurrentOS --console=plain --stacktrace --info
          exit $LASTEXITCODE
      - name: Test and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./gradlew :composeApp:desktopTest :composeApp:createDistributable :composeApp:packageDistributionForCurrentOS --console=plain
      - name: Show Windows packaging diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @()
          if (Test-Path 'composeApp/build/compose/logs') {
            $files += Get-ChildItem 'composeApp/build/compose/logs' -Recurse -File -Filter '*.txt'
          }
          if (Test-Path 'composeApp/build/compose/tmp') {
            $files += Get-ChildItem 'composeApp/build/compose/tmp' -Recurse -File -Filter '*.args.txt'
          }
          foreach ($file in $files) {
            Write-Output "::group::$($file.FullName)"
            Get-Content -LiteralPath $file.FullName -Encoding utf8
            Write-Output '::endgroup::'
          }
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ matrix.artifact }}
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/**/*.args.txt
            build/reports/problems/
          if-no-files-found: warn
      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Resolve-Path 'composeApp/build/compose/binaries/main/app/YMLStudio/YMLStudio.exe'
          $process = Start-Process -FilePath $app -ArgumentList @("--smoke-test", "--data-dir", "`"$env:RUNNER_TEMP/yml-smoke`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application failed" }
      - name: Smoke-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: composeApp/build/compose/binaries/main/app/YMLStudio.app/Contents/MacOS/YMLStudio --smoke-test --data-dir "$RUNNER_TEMP/yml-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: YMLStudio-${{ matrix.artifact }}
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.artifact }}
          path: composeApp/build/reports/tests/desktopTest/
